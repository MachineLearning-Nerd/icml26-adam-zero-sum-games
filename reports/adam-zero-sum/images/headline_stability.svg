<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc">
  <title id="title">Maximum stable step size decreases as beta increases</title>
  <desc id="desc">Five measured maximum stable step sizes from 0.0771 at beta minus 0.3 to 0.00291 at beta 0.9.</desc>
  <rect width="900" height="480" fill="#fbfbfd"/>
  <text x="54" y="42" font-family="sans-serif" font-size="24" font-weight="700" fill="#172033">Smaller β permits a wider stable step-size range</text>
  <text x="54" y="70" font-family="sans-serif" font-size="15" fill="#596579">Quadratic zero-sum game, Jacobian eigenvalues −1 ± 3i</text>
  <line x1="90" y1="390" x2="850" y2="390" stroke="#344054" stroke-width="2"/>
  <line x1="90" y1="90" x2="90" y2="390" stroke="#344054" stroke-width="2"/>
  <g stroke="#d8dee9" stroke-width="1">
    <line x1="90" y1="315" x2="850" y2="315"/><line x1="90" y1="240" x2="850" y2="240"/>
    <line x1="90" y1="165" x2="850" y2="165"/><line x1="90" y1="90" x2="850" y2="90"/>
  </g>
  <g font-family="sans-serif" font-size="13" fill="#596579">
    <text x="47" y="395">0.00</text><text x="47" y="320">0.02</text><text x="47" y="245">0.04</text>
    <text x="47" y="170">0.06</text><text x="47" y="95">0.08</text>
    <text x="111" y="417">−0.3</text><text x="286" y="417">0.0</text><text x="466" y="417">0.3</text>
    <text x="646" y="417">0.6</text><text x="826" y="417">0.9</text>
    <text x="440" y="452" font-size="15">first-order momentum β</text>
    <text x="19" y="270" transform="rotate(-90 19 270)" font-size="15">maximum stable h</text>
  </g>
  <polyline points="125,101 305,195 485,275 665,334 845,379" fill="none" stroke="#6941c6" stroke-width="5"/>
  <g fill="#6941c6" stroke="#fff" stroke-width="3">
    <circle cx="125" cy="101" r="8"/><circle cx="305" cy="195" r="8"/><circle cx="485" cy="275" r="8"/>
    <circle cx="665" cy="334" r="8"/><circle cx="845" cy="379" r="8"/>
  </g>
  <g font-family="sans-serif" font-size="13" font-weight="600" fill="#42307d">
    <text x="105" y="88">0.0771</text><text x="285" y="182">0.0521</text><text x="465" y="262">0.0306</text>
    <text x="645" y="321">0.0149</text><text x="785" y="365">0.00291</text>
  </g>
</svg>
