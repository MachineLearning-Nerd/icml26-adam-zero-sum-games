[project]
name = "adam-zero-sum-reproduction"
version = "0.1.0"
description = "Claim-by-claim reproduction of Adam-DA dynamics in zero-sum games"
requires-python = ">=3.11,<3.13"
dependencies = [
  "marimo>=0.14,<1",
  "matplotlib>=3.10,<4",
  "numpy>=2.2,<3",
  "pandas>=2.2,<3",
  "pillow>=11,<13",
  "scipy>=1.15,<2",
  "torch>=2.7,<3",
  "torchvision>=0.22,<1",
]

[tool.uv]
required-version = ">=0.11.29"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
